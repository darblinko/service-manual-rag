services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: service-manual-qdrant
    # Ports bind to the loopback interface only. Qdrant runs without authentication,
    # so do not publish these ports on a reachable interface.
    ports:
      - "127.0.0.1:6333:6333"  # REST API
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.32-community
    container_name: service-manual-neo4j
    ports:
      - "127.0.0.1:7474:7474"  # HTTP
      - "127.0.0.1:7687:7687"  # Bolt
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_data/logs:/logs
    environment:
      # The fallback password is a published local development default. It exists so that
      # `docker compose up qdrant` works without NEO4J_PASSWORD. Set NEO4J_PASSWORD in .env
      # for any other use; compose and the application both read it.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-smr_neo4j_dev_password}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512m
    restart: unless-stopped
    healthcheck:
      # NEO4J_AUTH holds "neo4j/<password>"; the password is read inside the container.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: service-manual-network
