[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-manual-rag"
version = "0.1.0"
description = "Hybrid vector and knowledge graph retrieval over equipment service manuals, with a diagnostic agent and an evaluation harness."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mitchell Foutz" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "qdrant-client>=1.10",
    "openai>=1.40",
    "neo4j>=5.14",
    "tenacity>=8.2",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2",
    "google-generativeai>=0.8",
    "pillow>=10.0",
]
ui = [
    "streamlit>=1.28",
    "pandas>=2.0",
]
pdf = [
    "unstructured[pdf]>=0.10",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
service-manual-rag = "service_manual_rag.cli:main"

[tool.setuptools.packages.find]
include = ["service_manual_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]
